<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="/data/vanta.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в маршрут</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="container">
        <div class="logo">🛵</div>
        <h1>Вход в маршрут</h1>
        <div class="subtitle">Введите данные для входа</div>
        
        <div class="error" id="errorMsg">❌ Неверный логин или пароль!</div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>👤 Логин</label>
                <input type="text" id="loginInput" placeholder="Введите логин" required autofocus>
            </div>
            <div class="form-group">
                <label>🔑 Пароль</label>
                <input type="password" id="passwordInput" placeholder="Введите пароль" required>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <span class="loading" id="spinner"></span>
                🔓 Войти
            </button>
        </form>
        
        <div class="footer">Маршрут мастера • офлайн-режим</div>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
