<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>История {{ name }}</title>
    <link rel="stylesheet" href="/static/css/master.css">
    <style>
        .hist { background: #fff; border-radius: 14px; padding: 12px; margin: 8px 0; }
        .hist b { display: block; margin-bottom: 4px; }
        .hist p { margin: 2px 0; white-space: pre-wrap; }
        .when { color: #78716c; font-size: 13px; }
    </style>
</head>
<body data-master="{{ name }}" data-page="history">
    <div class="brand"><img src="/static/img/vanta.png" alt="Vanta"></div>
    <h1>История</h1>
    <p><a href="/master/{{ name }}">← К маршруту</a></p>
    <div id="list">Загрузка...</div>
    <nav class="dock"></nav>
    <script src="/static/js/master.js"></script>
    <script>
        var labels = {
            done: 'Выполнено',
            fail: 'Велосипеда не было',
            evacuation: 'Эвакуация',
            evacuation_and_replace: 'Замена велосипеда',
            transit_replace: 'Замена велосипеда',
            replace_yes: 'Замена',
            replace_no: 'Куратор не дал',
            taken_no_replace: 'Забрали без замены'
        };
        function esc(value) {
            return String(value || '').replace(/[&<>]/g, function(ch) {
                return {'&':'&','<':'<','>':'>'}[ch];
            });
        }
        fetch('/api/master_history/{{ name }}')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var items = (data.history || []).slice().reverse();
                var box = document.getElementById('list');
                if (!items.length) { box.textContent = 'Пока пусто'; return; }
                box.innerHTML = items.map(function(item) {
                    var act = item.action || {};
                    var code = act.action || '';
                    var text = act.detail || act.parts || act.reason || '';
                    var title = act.label || labels[code] || 'Отметка';
                    if (code === 'evacuation_and_replace' || code === 'transit_replace') title = 'Замена велосипеда';
                    if (text === 'Отказ от эвакуации' || text.indexOf('Отказ от эвакуации') === 0) {
                        title = 'Отказ от эвакуации';
                        text = '';
                    }
                    var gos = act.gos || '';
                    var gosLine = gos ? '<p>' + esc(gos) + '</p>' : '';
                    var body = text ? '<p>' + esc(text).replace(/\n/g, '<br>') + '</p>' : '';
                    return '<div class="hist"><b>' + esc(title) + '</b>' + gosLine + body + '<div class="when">' + esc(item.timestamp || '') + '</div></div>';
                }).join('');
            })
            .catch(function() {
                document.getElementById('list').textContent = 'История не загрузилась';
            });
    </script>
</body>
</html>
