<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="/data/vanta.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOT-Мастер</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/static/css/iot.css">
</head>
<body>
    <div class="header">
        <h1>🔧 IOT-Мастер</h1>
        <a href="/logout" class="logout-btn" onclick="logout(event)">🚪 Выйти</a>
    </div>

    <div class="empty-state">
        <div class="empty-icon">📭</div>
        <h2>Багажник пуст</h2>
        <p>Загрузите прошитые IOT, чтобы начать работу</p>
        <button class="btn btn-primary" onclick="openBagModal()">📥 Загрузить багажник</button>
    </div>

    <div class="modal" id="bagModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeBagModal()">×</button>
            <h3>📥 Загрузить багажник</h3>
            <p style="color:#64748b;margin-bottom:12px;">
                Вставьте номера <strong>прошитых</strong> IOT (по одному в строке):
            </p>
            <textarea id="bagInput" placeholder="25-8800&#10;25-8801&#10;25-8802" style="width:100%;height:200px;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-family:monospace;font-size:14px;resize:vertical;"></textarea>
            <div style="margin-top:12px;text-align:right;display:flex;gap:10px;justify-content:flex-end;">
                <button class="btn btn-secondary" onclick="closeBagModal()">Отмена</button>
                <button class="btn btn-primary" onclick="loadBag()">✅ Проверить и загрузить</button>
            </div>
        </div>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeResultModal()">×</button>
            <h3>📋 Результат проверки</h3>
            <div id="resultContent"></div>
            <div style="margin-top:12px;text-align:right;">
                <button class="btn btn-primary" onclick="closeResultModalAndReload()">✅ Понятно</button>
            </div>
        </div>
    </div>

    <script src="/static/js/iot.js"></script>
</body>
</html>
