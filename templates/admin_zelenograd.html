<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Склад Зеленоград</title>
    <link rel="icon" href="/static/img/vb.jpg" type="image/jpeg">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #eef2f6; color: #0f172a; font: 16px/1.45 "Segoe UI", sans-serif; }
        .page { max-width: 820px; margin: 0 auto; padding: 28px 20px 60px; }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
        .brand img { width: 46px; height: 46px; border-radius: 50%; }
        a.back { color: #334155; font-weight: 700; text-decoration: none; }
        h1 { margin: 8px 0 4px; font-size: 32px; }
        .lead { color: #64748b; }
        .card { background: #fff; border-radius: 18px; padding: 6px 16px 10px; }
        .line { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 8px; border-bottom: 1px solid #f1f5f9; border-radius: 10px; }
        .line.low { background: #fef9c3; }
        .line.empty { background: #fee2e2; }
        .qty { display: flex; align-items: center; gap: 6px; }
        .qty button { width: 36px; height: 36px; border: 0; border-radius: 10px; background: #0f172a; color: #fff; font-size: 20px; font-weight: 800; cursor: pointer; }
        .qty input { width: 72px; height: 36px; text-align: center; border: 1px solid #cbd5e1; border-radius: 10px; font: inherit; font-weight: 800; }
        .legend { display: flex; gap: 8px; margin: 12px 0; }
        .legend span { border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 700; }
        .legend .low { background: #fef9c3; }
        .legend .empty { background: #fecaca; }
    </style>
</head>
<body>
<div class="page">
    <div class="brand"><img src="/static/img/vb.jpg" alt="VB"><a class="back" href="/admin">← В админку</a></div>
    <h1>Склад Зеленоград</h1>
    <p class="lead">Сюда запчасти кладёте только вы. Мастера забирают их себе в багажник. Жёлтым — 8 и меньше, красным — 4 и меньше.</p>
    <div class="legend"><span class="low">8 и меньше</span><span class="empty">4 и меньше</span></div>
    <section class="card">
        {% for row in rows %}
        <div class="line {% if row.qty <= 4 %}empty{% elif row.qty <= 8 %}low{% endif %}" data-part="{{ row.name }}">
            <span>{{ row.name }}</span>
            <div class="qty">
                <button type="button" onclick="nudgeZel(this, -1)">−</button>
                <input value="{{ row.qty }}" inputmode="numeric" onchange="typeZel(this)">
                <button type="button" onclick="nudgeZel(this, 1)">+</button>
            </div>
        </div>
        {% endfor %}
    </section>
</div>
<script>
function paintZel(line, qty) {
    line.classList.remove('low', 'empty');
    if (qty <= 4) line.classList.add('empty');
    else if (qty <= 8) line.classList.add('low');
}
function sendZel(line, qty) {
    if (qty < 0) qty = 0;
    var input = line.querySelector('input');
    input.disabled = true;
    fetch('/api/zelenograd_set', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ part: line.getAttribute('data-part'), qty: qty })
    }).then(function(response) { return response.json(); }).then(function(data) {
        input.disabled = false;
        if (!data.success) {
            alert(data.error || 'Не записалось');
            return;
        }
        input.value = data.qty;
        paintZel(line, data.qty);
        if (data.warning) alert(data.warning);
    }).catch(function() {
        input.disabled = false;
        alert('Нет сети');
    });
}
function nudgeZel(button, delta) {
    var line = button.parentNode.parentNode;
    var current = parseInt(line.querySelector('input').value, 10);
    if (isNaN(current)) current = 0;
    sendZel(line, current + delta);
}
function typeZel(input) {
    var qty = parseInt(input.value, 10);
    if (isNaN(qty)) return;
    sendZel(input.parentNode.parentNode, qty);
}
</script>
</body>
</html>
